name: Verify slash-answer regression
on:
  push:
    branches: [develop/offline-supabase-20261105]
    paths: [.github/workflows/slash-answer-review.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Browser setup
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify actual answer input flows
        run: node tests/answer-regressions.browser.cjs
