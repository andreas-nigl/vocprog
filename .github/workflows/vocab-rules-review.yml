name: Vocabulary rule review
# Review 7: regression harness compatibility and unchanged grouped-card requirements.
on:
  push:
    branches: [develop/offline-supabase-20261105]
    paths: [.github/workflows/vocab-rules-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Syntax and regression tests
        run: |
          node --check vocprog-answer-rules.js
          node --check vocprog-vocab-choices.js
          node --check vocprog-enhancements.js
          node --test tests/*.test.js tests/*.test.cjs
      - name: Browser dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser dropdown checks
        run: |
          node tests/vocab-choices.browser.cjs
          node tests/app-answer-flow.browser.cjs
      - name: Prepare vocabulary inventory without changes
        run: node tools/prepare-vocabulary-rules.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vocabulary-rule-review
          path: /tmp/vocprog-answer-rules
          retention-days: 30
