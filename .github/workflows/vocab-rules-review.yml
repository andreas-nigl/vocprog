name: Apply vocabulary rules once
on:
  push:
    branches: [develop/offline-supabase-20261105]
    paths: [.github/workflows/vocab-rules-review.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Save local answer rules with timestamp guards and read-back
        run: node tools/prepare-vocabulary-rules.cjs --apply
      - name: Confirm second run needs no changes
        env:
          VOC_RULES_OUTPUT: /tmp/vocprog-answer-rules-second-pass
        run: |
          node tools/prepare-vocabulary-rules.cjs
          node -e 'const r=require("/tmp/vocprog-answer-rules-second-pass/report.json"); if(r.changed!==0) process.exit(1); console.log("Second pass: zero updates, no AI calls");'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vocabulary-rule-migration-backup
          path: |
            /tmp/vocprog-answer-rules
            /tmp/vocprog-answer-rules-second-pass
          retention-days: 30
